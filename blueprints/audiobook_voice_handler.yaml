blueprint:
  name: Audiobook Voice Handler (local matcher)
  description: >
    Routes voice requests from one Voice Preview / Assist satellite device to
    a local audiobook-matcher service (github.com/cantolick/ha-rapidfuzz-ma),
    handling play / pause / resume / next-chapter / "what books do I have"
    requests against a curated Music Assistant playlist. No LLM, no cloud
    dependency — fuzzy string matching against a playlist you curate directly
    in Music Assistant.

    Requires three rest_command services already configured (see the repo's
    rest_commands.yaml): `ma_in_progress_audiobooks`, `ma_play_audiobook`, and
    `book_match` (pointed at your running audiobook-matcher instance).

    **TTS is intentionally disabled in this version.** Some Home Assistant
    Voice Preview devices on ESPHome 26.6.0/26.6.5 crash when playing any
    TTS/Assist URL audio — a firmware regression, not specific to this
    blueprint (see esphome/home-assistant-voice-pe#613, open/unfixed as of
    26.6.5, no newer firmware yet). Until that's fixed upstream (or your
    device is downgraded to ESPHome 2026.5.3), this blueprint runs silently:
    matches play or don't, with no spoken confirmation, error message, or
    "did you mean" disambiguation prompt. The `tts_target` input is kept so
    it's a small, non-breaking change to restore TTS calls once the firmware
    bug is fixed.
  domain: automation
  source_url: https://github.com/cantolick/ha-rapidfuzz-ma/blob/main/blueprints/audiobook_voice_handler.yaml
  input:
    satellite_device:
      name: Voice Satellite Device
      description: The Voice Preview / Assist satellite device this automation listens to. Only voice from this device is handled.
      selector:
        device:
          filter:
            - integration: esphome
            - integration: assist_satellite

    tts_target:
      name: TTS / Announcement Target
      description: >
        The media_player entity that would be used for spoken responses —
        currently unused since TTS is disabled (see blueprint description).
        Kept as an input so it's a small change to restore TTS once the
        upstream firmware bug is fixed.
      selector:
        entity:
          filter:
            - domain: media_player

    control_target:
      name: Playback Control Target
      description: >
        The media_player entity that actually reflects/controls audiobook
        playback (pause, next chapter) — often a separate Music-Assistant-
        managed entity from the satellite's own native one. Check which
        entity shows real playback state (title, position) if unsure.
      selector:
        entity:
          filter:
            - domain: media_player

    queue_id:
      name: Music Assistant Queue ID
      description: >
        The Music Assistant internal player_id used as queue_id for
        player_queues/play_media. Find it via the MA API's players/all
        command — it's usually the same string as an entity_id but confirm
        with player_queues/get, since it isn't always the same entity you'd
        pick for playback control above.
      selector:
        text:

    playlist_name:
      name: Playlist Name
      description: >
        Which playlist key (a key in the matcher's PLAYLIST_SOURCES_JSON
        config) this device's requests should search.
      default: "kids"
      selector:
        text:

trigger:
  - trigger: conversation
    command:
      - "play {utterance}"
      - "read {utterance}"
      - "listen to {utterance}"
      - "listen {utterance}"
      - "resume {utterance}"
      - "continue {utterance}"
      - "where I left off"
      - "what books do I have"
      - "which books do I have"
      - "list my books"
      - "pause"
      - "stop"
      - "next chapter"

variables:
  satellite_device_id: !input satellite_device
  ha_queue_id: !input queue_id
  ha_playlist_name: !input playlist_name

condition:
  - condition: template
    value_template: "{{ trigger.device_id == satellite_device_id }}"

action:
  - variables:
      utterance: "{{ trigger.sentence }}"

  # ── Step 1: Audiobook intent gate ───────────────────────────────
  # Keep this gate generic: book titles stay in the Music Assistant catalog,
  # while unrelated Assist requests continue to Home Assistant normally.
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {% set u = utterance | lower %}
              {% set keywords = [
                'play', 'read', 'listen', 'story', 'chapter',
                'resume', 'continue', 'audiobook', 'where i left',
                'what books', 'which books', 'pause', 'stop',
                'next chapter'
              ] %}
              {{ keywords | select('in', u) | list | length > 0 }}
        sequence:

          # ── Step 2: Detect intent type ─────────────────────────
          - variables:
              intent: >
                {% set u = utterance | lower %}
                {% if 'resume' in u or 'continue' in u or 'where i left' in u or 'i was listening' in u %}
                  resume
                {% elif 'what books' in u or 'which books' in u or 'list' in u or 'do i have' in u %}
                  list
                {% elif 'pause' in u or 'stop' in u %}
                  control
                {% elif 'next chapter' in u %}
                  control
                {% else %}
                  search
                {% endif %}

          # ── Step 3: Handle simple controls locally ─────────────
          # No API calls needed for pause/stop/next.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ intent == 'control' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ 'pause' in utterance | lower or 'stop' in utterance | lower }}"
                        sequence:
                          - action: media_player.media_pause
                            target:
                              entity_id: !input control_target
                      - conditions:
                          - condition: template
                            value_template: "{{ 'next chapter' in utterance | lower }}"
                        sequence:
                          - action: media_player.media_next_track
                            target:
                              entity_id: !input control_target

          # ── Step 4: Resume intent — fetch in-progress books ────
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ intent == 'resume' }}"
                sequence:
                  - action: rest_command.ma_in_progress_audiobooks
                    response_variable: in_progress_response

                  - variables:
                      in_progress_books: >
                        {% set items = in_progress_response.content %}
                        {% if items is string %}
                          {% set items = items | from_json %}
                        {% endif %}
                        {% set ns = namespace(books=[]) %}
                        {% for b in items %}
                          {% set clean_title = b.name | regex_replace('\s*\(Unabridged\)', '') %}
                          {% set ns.books = ns.books + [{"title": clean_title, "uri": b.uri}] %}
                        {% endfor %}
                        {{ ns.books | tojson }}

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ in_progress_books | from_json | length > 0 }}"
                        sequence:
                          - action: rest_command.book_match
                            data:
                              utterance: "{{ utterance }}"
                              books_json: "{{ in_progress_books }}"
                              mode: "resume"
                            response_variable: match_response

                          - variables:
                              match: >
                                {% set r = match_response.content %}
                                {% if r is string %}{{ r | from_json }}{% else %}{{ r }}{% endif %}

                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ match.error is not defined and match.disambiguation is not defined }}"
                                sequence:
                                  - action: rest_command.ma_play_audiobook
                                    data:
                                      queue_id: "{{ ha_queue_id }}"
                                      uri: "{{ match.uri }}"

          # ── Step 5: List intent — show available books ─────────
          # Silently no-ops for now — this was purely a TTS response (the
          # matcher's mode=list reply) and there's no audio state change to
          # fall back on. Re-enable once TTS is safe again.

          # ── Step 6: Search intent — find and play a book ───────
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ intent == 'search' }}"
                sequence:
                  - action: rest_command.book_match
                    data:
                      utterance: "{{ utterance }}"
                      playlist: "{{ ha_playlist_name }}"
                      mode: "search"
                    response_variable: match_response

                  - variables:
                      match: >
                        {% set r = match_response.content %}
                        {% if r is string %}{{ r | from_json }}{% else %}{{ r }}{% endif %}

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ match.error is not defined and match.disambiguation is not defined }}"
                        sequence:
                          - action: rest_command.ma_play_audiobook
                            data:
                              queue_id: "{{ ha_queue_id }}"
                              uri: "{{ match.uri }}"

mode: single
