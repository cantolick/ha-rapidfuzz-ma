# Example rest_commands.yaml for use with blueprints/audiobook_voice_handler.yaml.
#
# Copy the block(s) you need into your Home Assistant configuration.yaml (or
# a packages file) and replace the URL with wherever your matcher instance
# actually runs. Restart Home Assistant (or reload REST commands) after
# adding these.

# --- v2 blueprint (blueprints/audiobook_voice_handler.yaml) -----------------
# Only one rest_command needed: the matcher does its own intent
# classification, in-progress lookup, and matching, and returns a single
# small response the blueprint acts on.
rest_command:
  book_assist:
    url: "http://YOUR-MATCHER-HOST:8010/v1/assist"
    method: POST
    headers:
      Content-Type: application/json
    payload: >-
      {"utterance": "{{ utterance }}", "hint": "{{ hint }}", "playlist": "{{ playlist }}"}
    content_type: "application/json; charset=utf-8"

