blueprint:
  name: Audiobook Voice Handler (local matcher) v2
  description: >
    Routes voice requests from one Voice Preview / Assist satellite device to
    a local audiobook-matcher service (github.com/cantolick/ha-rapidfuzz-ma),
    handling play / pause / resume / next-chapter / "what books do I have"
    requests against a curated Music Assistant playlist. No LLM, no cloud
    dependency for the matching itself — fuzzy string matching against a
    playlist you curate directly in Music Assistant.

    **v2 — a real rewrite, not a drop-in upgrade.** If you're importing this
    over an existing v1 automation, you'll need to reconfigure it: `queue_id`
    and `control_target` are gone, replaced by one `ma_player` entity picker;
    the required rest_command changes from three (`book_match`,
    `ma_in_progress_audiobooks`, `ma_play_audiobook`) to one (`book_assist`,
    pointed at the matcher's new `/v1/assist` endpoint — see the repo's
    `examples/rest_commands.yaml`). The frozen v1 blueprint is still available
    at `blueprints/legacy/audiobook_voice_handler_v1.yaml` if you'd rather not
    migrate yet.

    The conversation trigger only matches specific book/audiobook request
    phrasings ("play ...", "resume my audiobook", "what books do I have",
    "pause the book", "next chapter"). Anything the satellite hears that
    doesn't match one of those phrasings is **not** consumed by this
    automation — Home Assistant's normal Assist pipeline (including Nabu Casa
    Cloud speech-to-text/text-to-speech and its usual conversation agent)
    still handles it, so lights, timers, weather, and general conversation
    keep working exactly as if this automation didn't exist.

    **What's actually new in v2, not just refactored:**
    - Disambiguation is real now — "did you mean X or Y?" gets spoken
      instead of silently discarded, once `speech_enabled` is on.
    - "What books do I have" is real now — it speaks the catalog summary
      instead of no-op'ing.
    - Resume is backed by a direct Audiobookshelf lookup instead of a
      hand-built rest_command against Music Assistant's own `last_played`
      ordering, which the HA community has reported as unreliable for
      Audiobookshelf-backed libraries.
    - Playback uses the native `music_assistant.play_media` action instead
      of hand-rolling Music Assistant's queue API — one `ma_player` input
      (filtered to Music-Assistant-backed players only) instead of a
      `queue_id` you had to dig out of MA's API by hand.

    **Important — conversation sentence triggers match house-wide, not just
    on the bound device.** Home Assistant matches sentence triggers against
    *any* Assist device before checking a trigger's own conditions or
    falling through to built-in intents — this is confirmed, permanent HA
    behavior, not something this blueprint can route around. A `search_commands`
    pattern using verbs also used for other smart-home intents (earlier
    versions of this default included "start" and "put on") would
    intercept "start a timer," "start the vacuum," or "put on the hallway
    lights" from *every* Assist device in the house — the automation's
    `satellite_device` condition then blocks it from running, but the
    sentence has already been claimed, so HA just says "Done" and nothing
    happens, on any device, not only the one this automation is bound to.
    The default below only uses "play/read/listen to," verbs not
    meaningfully used for other Assist intents, specifically to avoid this.
    **Known trade-off that remains:** it still matches non-book "play X"
    requests like "play some music" on the bound device specifically — see
    `search_commands` below for how to tighten that further if it comes up.

    **Before turning on `speech_enabled`:** some Voice PE devices crash on
    ESPHome 26.6.0/26.6.5 when playing any TTS audio (upstream firmware
    regression, esphome/home-assistant-voice-pe#613) — that's why this
    defaults to off. There's also an open Home Assistant core issue where
    trigger-scoped variables can interact badly with
    `set_conversation_response` (home-assistant/core#138166) — test on one
    device before enabling fleet-wide.

    Requires one rest_command service already configured (see the repo's
    `examples/rest_commands.yaml`): `book_assist`, pointed at your running
    audiobook-matcher instance's `/v1/assist` endpoint.
  domain: automation
  source_url: https://github.com/cantolick/ha-rapidfuzz-ma/blob/main/blueprints/audiobook_voice_handler.yaml
  input:
    satellite_device:
      name: Voice Satellite Device
      description: The Voice Preview / Assist satellite device this automation listens to. Only voice from this device is handled.
      selector:
        device:
          filter:
            - integration: esphome
            - integration: assist_satellite

    ma_player:
      name: Music Assistant Player
      description: >
        The Music Assistant media_player entity to play audiobooks on and
        control (pause, next chapter). Filtered to Music-Assistant-backed
        players — if more than one shows up for this device, check which
        one actually reflects live playback state (title, position); a
        satellite's own native media_player entity is a different one from
        the Music-Assistant-managed player and won't work here (see the
        README's troubleshooting note).
      selector:
        entity:
          filter:
            - integration: music_assistant
              domain: media_player

    playlist_name:
      name: Playlist Name
      description: >
        Which playlist key (a key in the matcher's PLAYLIST_SOURCES_JSON
        config) this device's requests should search.
      default: "kids"
      selector:
        text:

    speech_enabled:
      name: Enable Spoken Responses
      description: >
        Speak match confirmations, disambiguation prompts, no-match
        apologies, and book-list summaries through the satellite's normal
        Assist voice. Leave off if your device is affected by the ESPHome
        TTS-crash bug described above.
      default: false
      selector:
        boolean:

    search_commands:
      name: "Advanced: Search Trigger Phrasings"
      description: >
        Sentence patterns (Home Assistant sentence-trigger syntax) that
        route to the matcher's search mode. The default deliberately uses
        only "play/read/listen to" — verbs not used for other Assist
        intents — since sentence triggers match house-wide before a
        device condition is checked (see the blueprint description above).
        Avoid adding verbs like "start" or "put on" here even though they
        read naturally ("start the wimpy kid book"): they collide with
        timer/vacuum/light intents on every Assist device, not just this
        one, silently swallowing them into a generic "Done" instead. The
        remaining trade-off is non-book requests like "play some music" on
        this device specifically — replace with something like "(play|read)
        [me] [the] {utterance} (book|story)" to require a book-ish word if
        that comes up in your household.
      default:
        - "(play|read|listen to) [me] [the] {utterance}"
      selector:
        text:
          multiple: true

trigger:
  - id: search
    trigger: conversation
    command: !input search_commands

  - id: resume
    trigger: conversation
    command:
      - "(resume|continue) [my] (audiobook|book|story)"
      - "(resume|continue) where i left off"
      - "where was i"
      - "what was i (reading|listening to)"

  - id: list
    trigger: conversation
    command:
      - "what (books|audiobooks) do i have"
      - "which (books|audiobooks) do i have"
      - "what books can i (play|listen to)"

  - id: control_pause
    trigger: conversation
    command:
      - "pause [the] (audiobook|book|story)"
      - "stop [the] (audiobook|book|story)"

  - id: control_next
    trigger: conversation
    command:
      - "(next|skip to the next) chapter"

variables:
  satellite_device_id: !input satellite_device
  ha_playlist_name: !input playlist_name
  speech_enabled: !input speech_enabled
  utterance: "{{ trigger.sentence }}"

condition:
  - condition: template
    value_template: "{{ trigger.device_id == satellite_device_id }}"

action:
  - choose:
      - conditions:
          - condition: trigger
            id: control_pause
        sequence:
          - action: media_player.media_pause
            target:
              entity_id: !input ma_player

      - conditions:
          - condition: trigger
            id: control_next
        sequence:
          - action: media_player.media_next_track
            target:
              entity_id: !input ma_player

    default:
      # search / resume / list all go through the same single call — the
      # service classifies, looks up, matches, and phrases the response;
      # this automation only has to act on what comes back.
      - action: rest_command.book_assist
        continue_on_error: true
        data:
          utterance: "{{ utterance }}"
          hint: "{{ trigger.id }}"
          playlist: "{{ ha_playlist_name }}"
        response_variable: raw

      - variables:
          res: >-
            {% set c = raw.content if raw is defined and raw.status == 200 else none %}
            {% if c is string %}
              {{ c | from_json }}
            {% elif c is not none %}
              {{ c }}
            {% else %}
              {{ {"speech": "The book service is not responding.", "handled": true, "media": none} }}
            {% endif %}

      # res.media is a dict, and Home Assistant template conditions cannot
      # coerce a dict to a boolean - it evaluates false, so play_media would
      # silently never run. `is mapping` yields a real boolean.
      - if: "{{ res.media is mapping }}"
        then:
          - action: music_assistant.play_media
            target:
              entity_id: !input ma_player
            data:
              media_id: "{{ res.media.uri }}"
              enqueue: "{{ res.media.enqueue | default('replace') }}"

      - if: "{{ speech_enabled }}"
        then:
          - set_conversation_response: "{{ res.speech | default('') }}"
        else:
          - set_conversation_response: ""

mode: single
